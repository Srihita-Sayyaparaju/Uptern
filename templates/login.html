<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Uptern</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="container">

    <!-- Left Section -->
    <div class="left">

        <h1>🚀 Uptern</h1>

        <h2>Welcome Back!</h2>

        <p>
            Continue discovering internships with the help of AI.
        </p>

        <div class="features">

            <div class="feature">
                🤖 AI Career Assistant
            </div>

            <div class="feature">
                💼 Live Internship Listings
            </div>

            <div class="feature">
                🎯 Smart Recommendations
            </div>

        </div>

    </div>

    <!-- Right Section -->
    <div class="right">

        <div class="login-card">

            <h2>Login</h2>

            <p>Sign in to continue</p>

            <form action="/login" method="POST">

                <input
    type="email"
    id="email"
    name="email"
    placeholder="Email Address"
    oninput="this.value = this.value.toLowerCase()"
    required
>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >
                

                {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
                {% endif %}


                <button type="submit">
                    Login
                </button>

            </form>

            <p class="signup">

                Don't have an account?

                <a href="/signup">Sign Up</a>

            </p>

        </div>

    </div>

</div>

</body>
</html>
